# Skill taxonomy and rule-based extraction config.
#   skills:   skill -> skill area   (also the self-rated skills picker on the Profile page)
#   keywords: extra keyword -> skill (matched in certificate, project and event text)
# Every skill name is also a keyword automatically, plus each "/"-separated part of it
# that is at least 3 characters long (e.g. "django/flask" -> "django", "flask").
# Matching is case-insensitive, on word boundaries, longest keyword first.

areas:
  - PROGRAMMING
  - WEB
  - MOBILE
  - DATA_ANALYSIS
  - ML_AI
  - CLOUD_DEVOPS
  - SECURITY
  - DESIGN_UX
  - EMBEDDED_IOT
  - BUSINESS_PRODUCT

# Evidence weights (section 2.2 of the master prompt).
scoring:
  project: 3
  project_bonus: 1          # team lead, or a hackathon project
  certificate: 2
  skill_rating_factor: 0.5  # self rating (1-5) x 0.5
  event: 1
  event_bonus: 1            # finalist or winner
  area_cap: 15              # raw points that map to a score of 100

