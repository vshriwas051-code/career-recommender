# Target job roles.
#   profile:      ideal skill-area scores (0-100) — used for match score, gaps and synthetic data
#   interests:    interests (from app.yaml) typical of people in this role
#   certificates / projects: next-step suggestions; `area` links each to a skill gap,
#                 `level` is beginner (years 1-2, "explore") or advanced (years 3-4, "internship-ready")
#   events:       event types (from app.yaml) worth attending, with a reason

roles:
  - name: Software Developer
    summary: Builds and maintains software applications with strong programming fundamentals.
    profile: {PROGRAMMING: 85, WEB: 40, MOBILE: 25, DATA_ANALYSIS: 20, ML_AI: 15, CLOUD_DEVOPS: 35, SECURITY: 15, DESIGN_UX: 10, EMBEDDED_IOT: 10, BUSINESS_PRODUCT: 15}
    interests: [Building apps]
    certificates:
      - {name: "NPTEL Programming in Java", area: PROGRAMMING, level: beginner}
      - {name: "Coursera Python for Everybody", area: PROGRAMMING, level: beginner}
      - {name: "NPTEL Data Structures and Algorithms", area: PROGRAMMING, level: advanced}
      - {name: "Oracle Certified Associate Java SE", area: PROGRAMMING, level: advanced}
      - {name: "AWS Certified Developer – Associate", area: CLOUD_DEVOPS, level: advanced}
    projects:
      - {title: "Command-line expense tracker with file storage", area: PROGRAMMING, level: beginner}
      - {title: "Personal portfolio website", area: WEB, level: beginner}
      - {title: "REST API with tests and CI pipeline", area: PROGRAMMING, level: advanced}
      - {title: "Open-source contribution to a GitHub project", area: PROGRAMMING, level: advanced}
    events:
      - {type: Competition, why: "Coding contests sharpen problem solving for interviews"}
      - {type: Hackathon, why: "Ship a working product with a team under time pressure"}
      - {type: Workshop, why: "Learn tools like Git and testing frameworks hands-on"}

